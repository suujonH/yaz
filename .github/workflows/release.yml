name: Release

# Build and publish the zip and the auto-update manifest when a v* tag is pushed; a manual run only
# produces build artifacts and does not create a Release.
# Installed copies check releases/latest/download/YaZ-update.json for updates, so only stable
# releases (tags without -) are pushed to users.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $ver = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $ver = '0.0.0-ci.${{ github.run_number }}'
          }
          "VERSION=$ver" >> $env:GITHUB_ENV
          "PKG=YaZ-v$ver-win-x64" >> $env:GITHUB_ENV

      # The program version comes from the workspace version; change it to match the tag
      - name: Set workspace version
        run: |
          $path = (Resolve-Path Cargo.toml).Path
          $text = Get-Content -LiteralPath $path -Raw -Encoding utf8
          $pattern = '(?ms)(\[workspace\.package\][^\[]*?^version\s*=\s*)"[^"]*"'
          if ($text -notmatch $pattern) { throw 'Cargo.toml 的 [workspace.package] 中没有 version' }
          $text = [regex]::Replace($text, $pattern, { param($m) $m.Groups[1].Value + '"' + $env:VERSION + '"' })
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))

      - name: Test
        run: cargo test --workspace --release

      - name: Build
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # The updater is built separately: without the main app's network dependencies, to keep it
          # small
          cargo build --release -p yaz-updater
          cargo build --release -p yaz

      - name: Assemble
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force publish/YaZ | Out-Null
          Copy-Item target/release/yaz.exe, target/release/yaz-updater.exe, LICENSE, THIRD-PARTY-NOTICES.md publish/YaZ
          ./tools/build-plugins.ps1 -OutDir publish/YaZ/plugins

      # Generate the file list, the zip and YaZ-update.json; fail if the version is invalid or
      # differs from the program's
      - name: Pack
        run: ./tools/pack-release.ps1 -Version $env:VERSION -PublishDir publish/YaZ -OutDir release-out

      - name: Create release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $ghArgs = @('release', 'create', $tag, "release-out/$env:PKG.zip", 'release-out/YaZ-update.json', '--title', $tag, '--generate-notes')
          if ($tag.Contains('-')) { $ghArgs += '--prerelease' }
          gh @ghArgs

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: |
            release-out/${{ env.PKG }}.zip
            release-out/YaZ-update.json
